<title>Palestinian Drug Reference</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#1261c9;color:white;padding:30px 16px 34px}
.wrap{max-width:1000px;margin:auto}
h1{margin:0;font-size:30px}
.sub{margin-top:7px;opacity:.9}
.search{display:flex;gap:8px;margin-top:22px}
#q{flex:1;min-width:0;padding:16px;border:0;border-radius:12px;font-size:16px;outline:none}
#go{padding:0 20px;border:0;border-radius:12px;background:white;color:#1261c9;font-size:16px;font-weight:700;cursor:pointer}
main{padding:22px 16px 50px}
.status{color:#667085;margin-bottom:14px;font-size:14px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:18px;cursor:pointer}
.card:active{transform:scale(.99)}
.name{font-size:18px;font-weight:750}
.sci{margin-top:5px;color:#1261c9;font-weight:600}
.meta{margin-top:10px;color:#667085;font-size:14px;line-height:1.5}
.empty{background:white;border:1px dashed #d0d5dd;border-radius:14px;padding:30px;text-align:center;color:#667085}
#modal{display:none;position:fixed;inset:0;background:#0008;padding:15px;z-index:10;overflow:auto}
#modal.show{display:block}
.box{background:white;max-width:850px;margin:20px auto;border-radius:18px;overflow:hidden}
.top{padding:20px;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between;gap:15px}
.close{width:40px;height:40px;border:0;border-radius:10px;font-size:25px;cursor:pointer}
.fields{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{border:1px solid #e4e7ec;border-radius:11px;padding:13px}
.label{font-size:11px;font-weight:800;color:#667085;text-transform:uppercase;margin-bottom:6px}
.value{white-space:pre-wrap;line-height:1.5}
@media(max-width:600px){.search{flex-direction:column}#go{padding:14px}.fields{grid-template-columns:1fr}}
</style>
</head>

const COLUMNS = ["Commercial Name", "Sci Name", "Price3", "Size", "Company", "Indication, Dose, Route & Administration", "Contraindications", "Safe in Pregnancy & Lactation?", "Safe for HTN?", "Safe for DM?", "Age Limits", "Safe for G6PD?"];

function text(v) {
  return String(v == null ? "" : v).trim();
}

function esc(s) {
  return text(s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function field(row, possible) {
  for (const name of possible) {
    if (Object.prototype.hasOwnProperty.call(row, name) && text(row[name])) return text(row[name]);
  }
  return "";
}

function search() {
  const q = text(document.getElementById("q").value).toLowerCase();
  const matches = q === "" ? DATA : DATA.filter(function(row) {
    return COLUMNS.some(function(c) {
      return text(row[c]).toLowerCase().includes(q);
    });
  });
  render(matches);
}

function render(rows) {
  const list = document.getElementById("list");
  document.getElementById("status").textContent = rows.length + " medication" + (rows.length === 1 ? "" : "s") + " found";
  if (!rows.length) {
    list.innerHTML = '<div class="empty">No medication found.<br>Try the commercial or scientific name.</div>';
    return;
  }
  list.innerHTML = rows.map(function(row, i) {
    const n = field(row, ["Commercial Name"]) || "Medication";
    const s = field(row, ["Sci Name", "Scientific Name"]);
    const co = field(row, ["Company"]);
    const p = field(row, ["Price3", "Price"]);
    return '<div class="card" data-i="' + i + '">' +
      '<div class="name">' + esc(n) + '</div>' +
      '<div class="sci">' + esc(s) + '</div>' +
      '<div class="meta">' + (co ? '🏭 ' + esc(co) + '<br>' : '') + (p ? '💰 ' + esc(p) : '') + '</div>' +
      '</div>';
  }).join("");

  Array.from(list.querySelectorAll(".card")).forEach(function(card) {
    card.addEventListener("click", function() {
      openDrug(rows[Number(card.getAttribute("data-i"))]);
    });
  });
}

function openDrug(row) {
  document.getElementById("title").textContent = field(row, ["Commercial Name"]) || "Medication";
  document.getElementById("scientific").textContent = field(row, ["Sci Name", "Scientific Name"]);
  const fields = document.getElementById("fields");
  fields.innerHTML = COLUMNS.map(function(c) {
    const v = text(row[c]);
    return v ? '<div class="field"><div class="label">' + esc(c) + '</div><div class="value">' + esc(v) + '</div></div>' : "";
  }).join("");
  document.getElementById("modal").classList.add("show");
}

document.getElementById("go").addEventListener("click", search);
document.getElementById("q").addEventListener("keydown", function(e) {
  if (e.key === "Enter") search();
});
document.getElementById("close").addEventListener("click", function() {
  document.getElementById("modal").classList.remove("show");
});
document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === document.getElementById("modal")) document.getElementById("modal").classList.remove("show");
});

render(DATA);
</script>
</body>
